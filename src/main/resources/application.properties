spring.application.name=ms-campuslab-notifier
spring.application.name=ms-campuslab-notifier

server.port=8083

# Base de datos propia del microservicio
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Validacion de tokens para las consultas y descargas
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/7d5727ec-99c0-4161-9e1a-194c51532c5b/v2.0
campuslab.security.audience=3bdd9813-1e51-4686-a89a-760ac0531de9

# Conexion al cluster RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:172.31.45.233:5672,172.31.45.233:5673}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:campuslab}

spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s

# Consumidores con confirmacion manual
spring.rabbitmq.listener.type=simple
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Servidor SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

campuslab.mail.from=${MAIL_FROM}

# Documentos generados
campuslab.documents.directory=${DOCUMENTS_PATH:./storage}
campuslab.documents.zone=America/Santiago

# Monitorizacion
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never